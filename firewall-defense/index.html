<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1f2b52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Firewall Defense</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Anúncios com recompensa do Google (H5 Games Ads), em MODO DE TESTE:
       anúncios de mentira. Pra valer: trocar o ca-pub-123456789 pelo ID do
       AdSense aprovado pra jogos e tirar o data-adbreak-test (src/ads.js) -->
  <script async data-adbreak-test="on"
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-123456789"
    crossorigin="anonymous"></script>
  <script>
    window.adsbygoogle = window.adsbygoogle || [];
    var adBreak = adConfig = function (o) { adsbygoogle.push(o); };
  </script>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <div id="rotate">
    <div class="phone"></div>
    <p>Gire o celular para jogar</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
