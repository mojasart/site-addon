# Publica o jogo (firewall-defense/) no GitHub Pages a cada push na main.
# Link: https://mojasart.github.io/site-addon/
#
# Precisa estar ligado uma vez no repo (admin):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Dá pra rodar na mão em Actions → "Publica o jogo" → Run workflow.
name: Publica o jogo

on:
  push:
    branches: [main]
    paths:
      - 'firewall-defense/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um push novo cancela a publicação que ainda está rodando
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico inteiro: o número do build é a contagem de commits

      - name: Confere a chave do Gemini
        run: |
          if git grep -n 'AQ\.Ab8'; then
            echo '::error::Achei a chave do Gemini no repositório: não publiquei nada'
            exit 1
          fi

      # versão na tela inicial (v1.0.XXX): o build é o número de commits
      - name: Grava o número do build
        run: |
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/^export const BUILD = .*/export const BUILD = $BUILD;/" firewall-defense/src/config.js
          grep -n '^export const BUILD' firewall-defense/src/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: firewall-defense

      - id: deploy
        uses: actions/deploy-pages@v4
